---
# This file defines pre-commit and pre-push hooks.
# Includes a virtual environment check and basic
# tooling (black, isort, pylint, pip-audit).
default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: validate-pre-commit-config
        name: validate pre-commit configuration
        language: system
        entry: uv run pre-commit validate-config
        files: ^\.pre-commit-config\.yaml$
        pass_filenames: false

      - id: commitizen
        name: conventional commit message
        language: system
        entry: uv run cz check --commit-msg-file
        stages: [commit-msg]

      - id: black
        name: black (workspace)
        language: system
        entry: uv run black
        types: [python]
        files: ^(PREPARE-TIMES-NZ|SOLVE-TIMES-NZ|PUBLISH-TIMES-NZ|QA-TIMES-NZ)/.*\.py$
        exclude: ^(?:PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)|PUBLISH-TIMES-NZ/(?:build|dist|deployment_payload|releases|\.deployment_payload\.[^/]+\.staging|\.venv|\.mypy_cache|\.pytest_cache))/

      - id: isort
        name: isort (workspace)
        language: system
        entry: uv run isort --profile=black
        types: [python]
        files: ^(PREPARE-TIMES-NZ|SOLVE-TIMES-NZ|PUBLISH-TIMES-NZ|QA-TIMES-NZ)/.*\.py$
        exclude: ^(?:PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)|PUBLISH-TIMES-NZ/(?:build|dist|deployment_payload|releases|\.deployment_payload\.[^/]+\.staging|\.venv|\.mypy_cache|\.pytest_cache))/

      - id: pylint-prep
        name: pylint (PREPARE-TIMES-NZ)
        language: system
        entry: uv run --directory PREPARE-TIMES-NZ pylint src/prepare_times_nz scripts
        types: [python]
        files: ^PREPARE-TIMES-NZ/.*\.py$
        exclude: ^PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/
        pass_filenames: false

      - id: pylint-qa
        name: pylint (QA-TIMES-NZ)
        language: system
        entry: uv run --directory QA-TIMES-NZ pylint src/qa_times_nz
        types: [python]
        files: ^QA-TIMES-NZ/.*\.py$
        exclude: ^QA-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/
        pass_filenames: false

      - id: pylint-publish
        name: pylint (PUBLISH-TIMES-NZ)
        language: system
        entry: uv run --directory PUBLISH-TIMES-NZ pylint src/publish_times_nz app.py run_local.py
        types: [python]
        files: ^PUBLISH-TIMES-NZ/.*\.py$
        exclude: ^PUBLISH-TIMES-NZ/(?:build|dist|deployment_payload|releases|\.deployment_payload\.[^/]+\.staging|\.venv|\.mypy_cache|\.pytest_cache)/
        pass_filenames: false

      - id: pylint-solve
        name: pylint (SOLVE-TIMES-NZ)
        language: system
        entry: uv run --directory SOLVE-TIMES-NZ pylint src/solve_times_nz
        types: [python]
        files: ^SOLVE-TIMES-NZ/.*\.py$
        exclude: ^SOLVE-TIMES-NZ/(?:build|dist|\.venv|\.mypy_cache|\.pytest_cache)/
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest (workspace)
        language: system
        entry: uv run pytest PREPARE-TIMES-NZ/tests SOLVE-TIMES-NZ/tests PUBLISH-TIMES-NZ/tests
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (workspace)
        language: system
        entry: uv run pip-audit --skip-editable
        args:
          - --progress-spinner=off
        pass_filenames: false
        always_run: true
        stages: [pre-push]
