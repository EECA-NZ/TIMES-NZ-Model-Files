---
# This file defines pre-commit and pre-push hooks.
# Includes a virtual environment check and basic
# tooling (black, isort, pylint, pip-audit).
default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: validate-pre-commit-config
        name: validate pre-commit configuration
        language: system
        entry: uv run pre-commit validate-config
        files: ^\.pre-commit-config\.yaml$
        pass_filenames: false

      - id: commitizen
        name: conventional commit message
        language: system
        entry: uv run cz check --commit-msg-file
        stages: [commit-msg]

      - id: black
        name: black (workspace)
        language: system
        entry: uv run black
        types: [python]
        files: ^(PREPARE-TIMES-NZ|SOLVE-TIMES-NZ|PUBLISH-TIMES-NZ|QA-TIMES-NZ)/.*\.py$
        exclude: ^(?:PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)|PUBLISH-TIMES-NZ/(?:build|dist|deployment_payload|releases|\.deployment_payload\.[^/]+\.staging|\.venv|\.mypy_cache|\.pytest_cache))/

      - id: isort
        name: isort (workspace)
        language: system
        entry: uv run isort --settings-path .
        types: [python]
        files: ^(PREPARE-TIMES-NZ|SOLVE-TIMES-NZ|PUBLISH-TIMES-NZ|QA-TIMES-NZ)/.*\.py$
        exclude: ^(?:PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)|PUBLISH-TIMES-NZ/(?:build|dist|deployment_payload|releases|\.deployment_payload\.[^/]+\.staging|\.venv|\.mypy_cache|\.pytest_cache))/

      # Changed-file hooks run from root; full checks run from module directories.
      # Both use the root pylint configuration.

      - id: pylint-prep-precommit
        name: pylint PREPARE-TIMES-NZ (changed files)
        language: system
        entry: uv run pylint --rcfile=pyproject.toml
        types: [python]
        files: ^PREPARE-TIMES-NZ/.*\.py$
        exclude: ^PREPARE-TIMES-NZ/tests/
        pass_filenames: true
        stages: [pre-commit]

      - id: pylint-qa-precommit
        name: pylint QA-TIMES-NZ (changed files)
        language: system
        entry: uv run pylint --rcfile=pyproject.toml
        types: [python]
        files: ^QA-TIMES-NZ/.*\.py$
        exclude: ^QA-TIMES-NZ/tests/
        pass_filenames: true
        stages: [pre-commit]

      - id: pylint-publish-precommit
        name: pylint PUBLISH-TIMES-NZ (changed files)
        language: system
        entry: uv run pylint --rcfile=pyproject.toml
        types: [python]
        files: ^PUBLISH-TIMES-NZ/.*\.py$
        exclude: ^PUBLISH-TIMES-NZ/tests/
        pass_filenames: true
        stages: [pre-commit]

      - id: pylint-solve-precommit
        name: pylint SOLVE-TIMES-NZ (changed files)
        language: system
        entry: uv run pylint --rcfile=pyproject.toml
        types: [python]
        files: ^SOLVE-TIMES-NZ/.*\.py$
        exclude: ^SOLVE-TIMES-NZ/tests/
        pass_filenames: true
        stages: [pre-commit]

      # Full-module pylint checks before pushing.

      - id: pylint-prep-prepush
        name: pylint PREPARE-TIMES-NZ (full module)
        language: system
        entry: uv run --directory PREPARE-TIMES-NZ pylint --rcfile=../pyproject.toml src/prepare_times_nz scripts
        types: [python]
        files: ^PREPARE-TIMES-NZ/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pylint-qa-prepush
        name: pylint QA-TIMES-NZ (full module)
        language: system
        entry: uv run --directory QA-TIMES-NZ pylint --rcfile=../pyproject.toml src/qa_times_nz
        types: [python]
        files: ^QA-TIMES-NZ/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pylint-publish-prepush
        name: pylint PUBLISH-TIMES-NZ (full module)
        language: system
        entry: uv run --directory PUBLISH-TIMES-NZ pylint --rcfile=../pyproject.toml src/publish_times_nz app.py run_local.py
        types: [python]
        files: ^PUBLISH-TIMES-NZ/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pylint-solve-prepush
        name: pylint SOLVE-TIMES-NZ (full module)
        language: system
        entry: uv run --directory SOLVE-TIMES-NZ pylint --rcfile=../pyproject.toml src/solve_times_nz
        types: [python]
        files: ^SOLVE-TIMES-NZ/.*\.py$
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (workspace)
        language: system
        entry: uv run pytest PREPARE-TIMES-NZ/tests SOLVE-TIMES-NZ/tests PUBLISH-TIMES-NZ/tests
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (workspace)
        language: system
        entry: uv run pip-audit --skip-editable
        args:
          - --progress-spinner=off
        pass_filenames: false
        always_run: true
        stages: [pre-push]
