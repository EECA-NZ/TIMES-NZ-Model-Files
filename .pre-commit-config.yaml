---
# This file defines pre-commit and pre-push hooks.
# Includes a virtual environment check and basic
# tooling (black, isort, pylint, pip-audit, yamllint).
default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: commitizen
        name: conventional commit message
        language: system
        entry: uv run cz check --commit-msg-file
        stages: [commit-msg]

      - id: black
        name: black (workspace)
        language: system
        entry: uv run black
        types: [python]
        files: ^(PREPARE-TIMES-NZ|TIMES-NZ-INTERNAL-QA)/.*\.py$
        exclude: ^PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/

      - id: isort
        name: isort (workspace)
        language: system
        entry: uv run isort --profile=black
        types: [python]
        files: ^(PREPARE-TIMES-NZ|TIMES-NZ-INTERNAL-QA)/.*\.py$
        exclude: ^PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/

      - id: pylint-prep
        name: pylint (PREPARE-TIMES-NZ)
        language: system
        entry: uv run --directory PREPARE-TIMES-NZ pylint src/prepare_times_nz
        types: [python]
        files: ^PREPARE-TIMES-NZ/.*\.py$
        exclude: ^PREPARE-TIMES-NZ/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/
        pass_filenames: false

      - id: pylint-qa
        name: pylint (TIMES-NZ-INTERNAL-QA)
        language: system
        entry: uv run --directory TIMES-NZ-INTERNAL-QA pylint src/times_nz_internal_qa
        types: [python]
        files: ^TIMES-NZ-INTERNAL-QA/.*\.py$
        exclude: ^TIMES-NZ-INTERNAL-QA/(?:build|dist|output|data_raw|data_intermediate|\.venv|\.mypy_cache|\.pytest_cache|docs/_build)/
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^PREPARE-TIMES-NZ/.*\.(?:yml|yaml)$

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (workspace)
        language: system
        entry: uv run pip-audit --skip-editable
        args:
          - --progress-spinner=off
          # Pygments 2.19.2 is currently the latest PyPI release; remove this
          # ignore once CVE-2026-4539 has a patched upstream release.
          - --ignore-vuln=CVE-2026-4539
        pass_filenames: false
        always_run: true
        stages: [pre-push]
