[project]
name = "qa-times-nz"
version = "0.1.0"
description = "Internal handling and visualisation of TIMES-NZ result files"
readme = "readme.md"
authors = [{ name = "EECA" }]
requires-python = ">=3.12,<4"
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<3",
    "pygments==2.20.0",
    "publish-times-nz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
qa-times-nz = "qa_times_nz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_times_nz"]

[tool.pylint.main]
source-roots = ["src"]
