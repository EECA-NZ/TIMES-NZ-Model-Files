[project]
name = "solve-times-nz"
version = "0.1.0"
description = "Reproducible DD-case builder for TIMES-NZ"
readme = "README.md"
authors = [{ name = "EECA" }]
requires-python = ">=3.12,<4"
dependencies = [
    "pandas>=2.2,<3",
    "xl2times==0.3.0",
]

[project.scripts]
solve-times-nz = "solve_times_nz.cli:main"
xl2times-fixed = "solve_times_nz.xl2times_compat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solve_times_nz"]

[tool.pylint.main]
source-roots = ["SOLVE-TIMES-NZ/src"]

