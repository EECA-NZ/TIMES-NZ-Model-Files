---
name: CI Pipeline

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the workspace
        run: uv sync --locked --group dev
      - name: Run linters
        working-directory: PREPARE-TIMES-NZ
        run: |
          uv run black --check --diff src tests scripts
          uv run isort --profile black --check-only src tests scripts
          uv run pylint src/prepare_times_nz scripts
          uv run yamllint .
      - name: Run PREPARE tests and build HTML coverage
        working-directory: PREPARE-TIMES-NZ
        run: |
          uv run coverage run -m pytest
          uv run coverage html
      - name: Run QA tests
        working-directory: TIMES-NZ-INTERNAL-QA
        run: uv run pytest
      - name: Run pip-audit
        run: uv run pip-audit --skip-editable
      - name: Publish coverage to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: PREPARE-TIMES-NZ/htmlcov
      - name: Coverage summary
        working-directory: PREPARE-TIMES-NZ
        run: uv run coverage report

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      ${{ success() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
