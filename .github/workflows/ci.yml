---
name: CI Pipeline

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the workspace
        run: uv sync --locked --group dev
      - name: Validate pre-commit configuration
        run: uv run pre-commit validate-config
      - name: Run linters
        working-directory: PREPARE-TIMES-NZ
        run: |
          uv run black --check --diff src tests scripts
          uv run isort --settings-path .. --check-only src tests scripts
          uv run pylint --rcfile=../pyproject.toml src/prepare_times_nz scripts
      - name: Run SOLVE linters
        working-directory: SOLVE-TIMES-NZ
        run: |
          uv run black --check --diff src tests
          uv run isort --settings-path .. --check-only src tests
          uv run pylint --rcfile=../pyproject.toml src/solve_times_nz
      - name: Run PUBLISH linters
        working-directory: PUBLISH-TIMES-NZ
        run: |
          uv run black --check --diff src tests app.py run_local.py
          uv run isort --settings-path .. --check-only src tests app.py run_local.py
          uv run pylint --rcfile=../pyproject.toml src/publish_times_nz app.py run_local.py
      - name: Run workspace tests and build HTML coverage
        run: |
          uv run coverage run -m pytest PREPARE-TIMES-NZ/tests SOLVE-TIMES-NZ/tests PUBLISH-TIMES-NZ/tests QA-TIMES-NZ/tests
          uv run coverage html
      - name: Run pip-audit
        run: uv run pip-audit --skip-editable
      - name: Publish coverage to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: htmlcov
      - name: Coverage summary
        run: uv run coverage report

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      ${{ success() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
