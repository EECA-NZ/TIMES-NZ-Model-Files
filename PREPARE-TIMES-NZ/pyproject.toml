[project]
name = "PREPARE-TIMES-NZ"
version = "0.1.0"
description = "Data-prep pipeline for the TIMES-NZ model"
readme = "readme.md"
authors = [{ name = "EECA" }]
requires-python = ">=3.12,<4"
dependencies = [
    "doit>=0.36,<0.37",
    "filelock>=4.2.1,<5",
    "nrel-pysam>=7.1,<8",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "seaborn>=0.13,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepare_times_nz"]

[tool.black]
target-version = ["py312"]

[tool.pylint.main]
source-roots = ["PREPARE-TIMES-NZ/src"]
