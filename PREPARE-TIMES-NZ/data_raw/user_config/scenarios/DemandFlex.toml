INVCOST = ["", "", "", "", "250", "250"]
Attribute = ["STG_SIFT", "STG_SIFT", "STG_SIFT", "STG_SIFT", "STG_SIFT", "STG_SIFT"]
2023 = [0.5, 0.5, 0.05, 0.05, 0, 0]
