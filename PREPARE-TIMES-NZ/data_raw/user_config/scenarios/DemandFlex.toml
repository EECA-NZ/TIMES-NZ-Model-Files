# Demand flex processes. Currently just ripple hot water

# Once the pattern is established and working, we should generalise this method to other techs and script
# This config file is already a little bit hard to read

# PLEASE NOTE: this will do nothing unless the relevant DMD processes have DAYNITE enabled
# As a rule, we do not enable DAYNITE on DMD processes because this leads to overoptimisation.
# However, it's necessary to use this on processes sparingly to enable correct load-shifting behaviour. 
# Currently, the relevant processes are listed in an input assumptions file. It would be better to centralise this method
# and config. 

WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Steady"

[ResidentialFlexTechsSteady]
Description = "Defines residential flex processes"
SheetName = "Residential"
TagName = "FI_Process"
Sets = ["STG", "STG"]
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
PrimaryCG = ["DEM","DEM"]
TsLvl = ["DAYNITE","DAYNITE"]
Tact = ["PJ", "PJ"]
Tcap = ["PJa","PJa"]

[ResidentialFlexParameters50]
Description = "Defines parameters for residential ripple control (50%)"
SheetName = "Residential"
TagName = "FI_T"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX","JD-S_HEAT-FLEX", "DD-S_HEAT-FLEX"]
Comm-In = ["JD-WH_LOW", "DD-WH_LOW","JD-S_HEAT", "DD-S_HEAT"]
Comm-Out = ["JD-WH_LOW", "DD-WH_LOW","JD-S_HEAT", "DD-S_HEAT"]
INVCOST = ["","","250","250"]
Attribute = ["STG_SIFT", "STG_SIFT","STG_SIFT", "STG_SIFT"]
2023 = [0.5,0.5,0.5,0.5] # can shift 50% of load
STG_EFF = [0.99, 0.99, 0.9,0.9] # 1% heatloss for water, 10 for hp controller
START = [2024, 2024]



[ResidentialFlexTechsShift]
WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Shift"
Description = "Defines residential flex processes"
SheetName = "Residential"
TagName = "FI_Process"
Sets = ["STG", "STG"]
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
PrimaryCG = ["DEM","DEM"]
TsLvl = ["DAYNITE","DAYNITE"]
Tact = ["PJ", "PJ"]
Tcap = ["PJa","PJa"]

[ResidentialFlexParameters90]
Description = "Defines parameters for residential demand flex shifts"
WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Shift"
SheetName = "Residential"
TagName = "FI_T"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX","JD-S_HEAT-FLEX", "DD-S_HEAT-FLEX"]
Comm-In = ["JD-WH_LOW", "DD-WH_LOW","JD-S_HEAT", "DD-S_HEAT"]
Comm-Out = ["JD-WH_LOW", "DD-WH_LOW","JD-S_HEAT", "DD-S_HEAT"]
INVCOST = ["","","250","250"]
Attribute = ["STG_SIFT", "STG_SIFT","STG_SIFT", "STG_SIFT"]
2023 = [0.5,0.5,0.5,0.5] # can shift 50% of load
2050 = [0.9,0.9,0.9,0.9] # scales to 90% by 2050
STG_EFF = [0.99, 0.99, 0.9,0.9] # 1% heatloss for water, 10 for hp controller
START = [2024, 2024]




