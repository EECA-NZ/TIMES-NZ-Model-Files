# Demand flex processes for residential hot water and heat pump space heating.

# Once the pattern is established and working, we should generalise this method to other techs and script
# This config file is already a little bit hard to read

# PLEASE NOTE: this will do nothing unless the relevant DMD processes have DAYNITE enabled
# As a rule, we do not enable DAYNITE on DMD processes because this leads to overoptimisation.
# However, it's necessary to use this on processes sparingly to enable correct load-shifting behaviour. 
# Currently, the relevant processes are listed in an input assumptions file. It would be better to centralise this method
# and config. 

WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Steady"

[ResidentialFlexTechsSteady]
Description = "Defines residential flex processes"
SheetName = "Residential"
TagName = "FI_Process"
Sets = ["STG", "STG", "STG", "STG", "STG", "STG"]
TechName = [
    "JD-WH_LOW-FLEX",
    "DD-WH_LOW-FLEX",
    "JD-WH_LOW-SMART",
    "DD-WH_LOW-SMART",
    "JD-S_HEAT-FLEX",
    "DD-S_HEAT-FLEX",
]
PrimaryCG = ["DEM", "DEM", "DEM", "DEM", "DEM", "DEM"]
TsLvl = ["DAYNITE", "DAYNITE", "DAYNITE", "DAYNITE", "DAYNITE", "DAYNITE"]
Tact = ["PJ", "PJ", "PJ", "PJ", "PJ", "PJ"]
Tcap = ["PJa", "PJa", "PJa", "PJa", "PJa", "PJa"]

[ResidentialFlexParametersSteady]
