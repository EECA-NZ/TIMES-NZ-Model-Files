# Demand flex processes. Currently just ripple hot water

# Once the pattern is established and working, we should generalise this method to other techs and script
# This config file is already a little bit hard to read

WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Traditional"

[ResidentialFlexTechsTraditional]
Description = "Defines residential flex processes"
SheetName = "Residential"
TagName = "FI_Process"
Sets = "STG"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
Tact = "PJ"
Tcap = "PJa"
TsLvl = "DAYNITE"

[ResidentialFlexParameters50]
Description = "Defines parameters for residential ripple control (50%)"
SheetName = "Residential"
TagName = "FI_T"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
Comm-IN = ["JD-WH_LOW", "DD-WH_LOW"]
Comm-Out = ["JD-WH_LOW", "DD-WH_LOW"]
STG_SIFT = [0.5,0.5] # can shift 50% of load
STG_EFF = [0.99, 0.99] # 1% heatloss




[ResidentialFlexTechsTransformation]
WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Transformation"
Description = "Defines residential flex processes"
SheetName = "Residential"
TagName = "FI_Process"
Sets = "STG"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
Tact = "PJ"
Tcap = "PJa"
TsLvl = "DAYNITE"

[ResidentialFlexParameters90]
Description = "Defines parameters for residential ripple control (scaling to 90%)"
WorkBookName = "SubRES_TMPL/SubRES_DemandFlex_Transformation"
SheetName = "Residential"
TagName = "FI_T"
TechName = ["JD-WH_LOW-FLEX", "DD-WH_LOW-FLEX"]
Comm-IN = ["JD-WH_LOW", "DD-WH_LOW"]
Comm-Out = ["JD-WH_LOW", "DD-WH_LOW"]
Attribute = ["STG_SIFT", "STG_SIFT"]
2023 = [0.5,0.5] # can shift 50% of load
2050 = [0.9,0.9] # scales to 90% by 2050
0 = [5,5] # standard forward interp
STG_EFF = [0.99, 0.99] # 1% heatloss





