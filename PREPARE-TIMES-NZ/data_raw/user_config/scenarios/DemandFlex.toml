    "JD-WH_LOW-FLEX",
    "DD-WH_LOW-FLEX",
    "JD-WH_LOW-SMART",
    "DD-WH_LOW-SMART",
    "JD-S_HEAT-FLEX",
    "DD-S_HEAT-FLEX",
