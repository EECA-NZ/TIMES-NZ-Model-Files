# New electricity sector technologies for TIMES-NZ

WorkBookName = "SubRES_TMPL/SubRES_NewTechs_ELC_Steady"

# The standard scenario uses the MBIE reference scenario and the NREL conserative price paths 

# We break this down by genstack, offshore wind, residential solar, and batteries 
# Due to the way subres files are processed in Veda, it is required that each sheet begin with the sector
# As defined in the BY Files
# So all sheets must start with ELC_, TRA_, etc

# fun fact: it's much better to do genstack last in this config file. The reason for this is it's quite big data, 
# and opening/closing the file slows down it's included. It's not hugely important, but there are quite a few file read/writes,
# it's much more efficient to not load the bigger data over and over 


###############################################################################
# Offshore Wind
###############################################################################


[OffshoreWindProcesses]
Description = "Declares processes for offshore wind plants"
SheetName = "ELC_OffshoreWind"
TagName = "FI_Process"
DataLocation = "data_intermediate/stage_4_veda_format/subres_elc/offshore/process_definitions.csv"

[OffshoreWindDetails]
Description = "Provides key assumptions for offshore wind plants"
SheetName = "ELC_OffshoreWind"
TagName = "FI_T"
DataLocation = "data_intermediate/stage_4_veda_format/subres_elc/offshore/base_file.csv"

[OffshoreWindCostCurves]
Description = "Standard cost curve projections for offshore wind plants (NREL conservative)"
SheetName = "ELC_OffshoreWind"
TagName = "FI_T"
DataLocation = "data_intermediate/stage_4_veda_format/subres_elc/offshore/cost_curves_conservative.csv"

[OffshoreWindIslandDefinitions]
WorkBookName = "SubRES_TMPL/SubRES_NewTechs_ELC_Steady_trans"
Description = "SubRES Shift - ensure offshore wind built in correct islands. Idea: test adding this to main subres instead?"
DataLocation = "data_intermediate/stage_4_veda_format/subres_elc/offshore/island_definitions.csv"
SheetName = "AVA"
TagName = "TFM_AVA"





