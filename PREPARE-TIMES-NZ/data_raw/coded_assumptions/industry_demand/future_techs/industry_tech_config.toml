# This config file is used to generate new industrial technologies and define what existing uses/techs they might replace

[newtechsSGHP]
TechCode = "SGHP"
Technology = "Steam Generating Heat Pump"
TechnologyGroup = "Heat/Cooling Devices"
EndUse = ["PH_INT", "PH_LOW"] # intermediate/low process heat
ReplacedTechs = ["BOILR"] # just boiler use (could expand to furnace/kiln possibly?)
InputFuel = ["ELC"]
Sectors = ["DARY", "MEAT", "WOOD", "PULP", "OTHR", "FOOD"]



[newtechsBOILR]
TechCode = "BOILR" # NOTE: existing tech code. Below labels match concordances for BOILR in industrial use
Technology = "Boiler Systems"
TechnologyGroup = "Heat/Cooling Devices"
EndUse = ["PH_LOW"] # process heating boiler
ReplacedTechs = ["BOILR"] # replacing other boilers (nga, coal, etc - anything not electricity)
InputFuel = ["ELC"]
Sectors = ["DARY", "MEAT", "OTHR", "FOOD", "MINE"]



[newtechsHPPH]
TechCode = "HPPH"
Technology = "Heat Pump (process heat)"
TechnologyGroup = "Heat/Cooling Devices"
EndUse = ["PH_LOW"] # low process heat
ReplacedTechs = ["BOILR", "BURNR", "FURNC"]
InputFuel = ["ELC"]
Sectors = ["DARY", "FOOD", "MEAT", "MNRL", "OTHR", "PULP", "WOOD", "STEEL"]



[newtechsHPSH]
TechCode = "HPSH"
Technology = "Heat Pump (space heating)"
TechnologyGroup = "Heat/Cooling Devices"
EndUse = ["SH_LOW"] # low process heat
InputFuel = ["ELC"]
# all sectors except CHEM (which has the tech already from the EEUD)
Sectors = ["ALUM","CNST","DARY","FOOD","STEEL","MEAT","METH","MINE","MNRL","OTHR","PULP","UREA","WOOD"]



[newtechsBIOFURNC]
TechCode = "BIOFURNC"
Technology = "Furnace/Kiln"
TechnologyGroup = "Heat/Cooling Devices"
EndUse = ["PH_HIGH"]
ReplacedTechs = ["FURNC"]
InputFuel = ["WOD"]
Sectors = ["MNRL"]


[newtechsBEV]
TechCode = "BEV"
Technology = "Electric Vehicle"
TechnologyGroup = "Mobile Motors"
EndUse = ["MTV_MOB"] 
ReplacedTechs = ["ICENG"]
InputFuel = ["ELC"]
Sectors = ["CNST", "OTHR", "MINE"]
 

 
[newtechsHFCV]
TechCode = "HFCV"
Technology = "Hydrogen Vehicle"
TechnologyGroup = "Mobile Motors"
EndUse = ["MTV_MOB"] 
ReplacedTechs = ["ICENG"]
InputFuel = ["H2R"]
Sectors = ["CNST", "OTHR", "MINE"]