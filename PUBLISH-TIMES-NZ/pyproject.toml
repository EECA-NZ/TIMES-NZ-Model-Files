[project]
name = "publish-times-nz"
version = "0.1.0"
description = "Release artefacts and Explorer for TIMES-NZ results"
readme = "readme.md"
requires-python = ">=3.12,<4"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "plotly>=6.3.1,<7",
    "polars>=1.34.0,<2",
    "pyarrow>=23.0.1,<24",
    "python-dotenv>=1.2.1,<2",
    "shiny>=1.5.0,<2",
    "shinywidgets>=0.7.0,<0.8",
]

[project.scripts]
publish-times-nz = "publish_times_nz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publish_times_nz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
